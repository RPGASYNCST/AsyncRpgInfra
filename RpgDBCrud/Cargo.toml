[package]
name = "rpg-db-crud"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "API REST CRUD para o Async RPG (MariaDB + Axum + SQLx)"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

