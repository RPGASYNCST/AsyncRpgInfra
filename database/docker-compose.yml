services:
  mariadb:
    image: mariadb:11.4
    container_name: async-rpg-mariadb
    restart: unless-stopped
    # O banco escuta só no loopback do servidor: nunca fica exposto na rede.
    # A API acessa pela rede interna do Docker (async_rpg_net); para administração,
    # use um túnel SSH até o servidor (ex.: ssh -L 3306:127.0.0.1:3306 usuario@servidor).
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?defina MARIADB_ROOT_PASSWORD no .env}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-asyncrpg}"
      MARIADB_USER: "${MARIADB_USER:-asyncrpgadmin}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?defina MARIADB_PASSWORD no .env}"
      TZ: "UTC"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - async_rpg_net

  rpg-db-crud:
    build:
      context: ../RpgDBCrud
      dockerfile: Dockerfile
    container_name: async-rpg-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    # Porta consumida pelo proxy reverso (Nginx Proxy Manager), que termina o HTTPS.
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: "mysql://${MARIADB_USER:-asyncrpgadmin}:${MARIADB_PASSWORD_ENCODED:?defina MARIADB_PASSWORD_ENCODED no .env}@mariadb:3306/${MARIADB_DATABASE:-asyncrpg}"
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      RUST_LOG: "rpg_db_crud=info,tower_http=info"
    networks:
      - async_rpg_net

volumes:
  mariadb_data:
    name: async_rpg_mariadb_data

networks:
  async_rpg_net:
    name: async_rpg_net
    driver: bridge

