name: Deploy MariaDB (Aplicação)

on:
  push:
    branches: [main]
    paths:
      - "database/**"
      - "RpgDBCrud/**"
      - ".github/workflows/deploy-mariadb.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      infra_repo:
        description: "Repositório de infraestrutura (ex: RPGASYNCST/AsyncRpgInfra)"
        required: false
        type: string
      infra_ref:
        description: "Branch ou tag do repositório de infraestrutura"
        required: false
        type: string
        default: "main"
    secrets:
      INFRA_TOKEN:
        description: "Token de leitura caso o AsyncRpgInfra seja privado"
        required: false
      MARIADB_ROOT_PASSWORD:
        required: true
      MARIADB_PASSWORD:
        required: true
      MARIADB_USER:
        required: false
      MARIADB_DATABASE:
        required: false
      MARIADB_PORT:
        required: false

concurrency:
  group: deploy-mariadb-production
  cancel-in-progress: false

jobs:
  deploy-db:
    name: Subir/Atualizar MariaDB & API RpgDBCrud
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout do repositório atual
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Baixar pasta database/ do AsyncRpgInfra (quando chamado via workflow_call)
        if: ${{ ! hashFiles('database/docker-compose.yml') }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo || format('{0}/AsyncRpgInfra', github.repository_owner) }}
          ref: ${{ inputs.infra_ref || 'main' }}
          path: .async-rpg-infra
          token: ${{ secrets.INFRA_TOKEN || github.token }}

      - name: Verificar acesso ao Docker Compose (sem sudo)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::O usuário do runner ($USER) não tem permissão para acessar o Docker sem sudo."
            echo "Execute uma única vez no servidor Linux:"
            echo "  sudo usermod -aG docker $USER && sudo systemctl restart actions.runner.*"
            exit 1
          fi
          docker compose version

      # As tabelas são criadas pelas migrations da API (RpgDBCrud/migrations) quando o
      # container dela sobe; por isso este workflow não roda sqlx migrate run.
      - name: Sincronizar arquivos de configuração e subir MariaDB + API
        env:
          DB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.MARIADB_PASSWORD }}
          DB_USER: ${{ secrets.MARIADB_USER || 'asyncrpgadmin' }}
          DB_NAME: ${{ secrets.MARIADB_DATABASE || 'asyncrpg' }}
          DB_PORT: ${{ secrets.MARIADB_PORT || '3306' }}
        run: |
          if [ -z "$DB_ROOT_PASSWORD" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::As secrets MARIADB_ROOT_PASSWORD e MARIADB_PASSWORD precisam estar configuradas no GitHub (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          case "$DB_ROOT_PASSWORD$DB_PASSWORD" in
            *"'"*)
              echo "::error::As senhas do banco não podem conter aspas simples (')."
              exit 1
              ;;
          esac
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq não está instalado no runner (necessário para codificar a senha na URL)."
            exit 1
          fi

          DEPLOY_ROOT="$HOME/async-rpg-stack"
          DEPLOY_DIR="$DEPLOY_ROOT/database"
          mkdir -p "$DEPLOY_DIR/conf.d" "$DEPLOY_DIR/init" "$DEPLOY_ROOT/RpgDBCrud"

          SRC_ROOT="."
          if [ -d ".async-rpg-infra/database" ]; then
            SRC_ROOT=".async-rpg-infra"
          fi

          cp "$SRC_ROOT/database/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
          cp -r "$SRC_ROOT/database/conf.d/." "$DEPLOY_DIR/conf.d/"
          cp -r "$SRC_ROOT/database/init/." "$DEPLOY_DIR/init/"
          if [ -d "$SRC_ROOT/RpgDBCrud" ]; then
            cp -r "$SRC_ROOT/RpgDBCrud/." "$DEPLOY_ROOT/RpgDBCrud/"
          fi
          rm -rf .async-rpg-infra

          # Codifica a senha inteira para a DATABASE_URL (#, @, /, :, % etc.).
          ENCODED_PASS="$(jq -rn --arg v "$DB_PASSWORD" '$v|@uri')"
          # Aspas simples nas senhas evitam que '#' seja lido como comentário pelo Docker Compose
          printf "MARIADB_PORT='%s'\nMARIADB_DATABASE='%s'\nMARIADB_USER='%s'\nMARIADB_PASSWORD='%s'\nMARIADB_PASSWORD_ENCODED='%s'\nMARIADB_ROOT_PASSWORD='%s'\n" \
            "$DB_PORT" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$ENCODED_PASS" "$DB_ROOT_PASSWORD" > "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env"

          cd "$DEPLOY_DIR"
          docker compose up -d --build --wait
          docker compose ps
